<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişken tanımla
            var number1, number2, sum; 

            //ziyaretçiden iki tane sayı al
            number1=Number(prompt("1.Sayıyı Giriniz:"));
            number2=Number(prompt("2.Sayıyı Giriniz:"));
            
            //iki sayının toplamını hesapla 
            sum=number1+number2;
 
            //ziyaretçiye sonucu yaz
            document.write("1.Girdiğiniz sayı: "+number1+" "+"2.Girdiğiniz sayı: "+number2+" "+"Girdiğiniz Sayının Toplamı: "+sum);
        </script> 
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişken tanımla
            var x, a, b; 

 
            //ziyaretçiden a ve b değerini alın
            a=Number(prompt("a değerini yazınız:"));
            b=Number(prompt("b değerini yazınız:"));

            //x formülünü yaz 
            x=-b/a;

            //ziyaretçiye sonucu yaz
            document.write("x= "+x);

        </script> 
    </body>
</html>

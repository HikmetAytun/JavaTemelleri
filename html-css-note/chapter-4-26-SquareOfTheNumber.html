<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişken tanımla
            var number, square; 

            //ziyaretçiden sayı al
            number=prompt("Sayı Giriniz:");

            //karesini hesapla 
            square=number*number;

            //ziyaretçiye sonucu yaz
            document.write("Girdiğiniz sayı: "+number+" "+"Girdiğiniz Sayının Karesi "+square);
        </script> 
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Fonksiyon Nedir?</title>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            /* Değer döndürmeyen fonksiyonlar
                Bu tür fonksiyonlar ana program tarafından çağırılarak çalıştırılır fakat
                ana programa bir değer göndermezler/döndürmezler. O nedenle bu tür fonksiyonlara
                "değer döndürmeyen fonksiyonlar" denir.
                Örnek: */
                function merhaba() {
                    document.write("Merhaba!");
                }
                merhaba(); // Fonksiyon çağırılır ve çalıştırılır. 
                           // Fakat ana programa bir değer döndürmez.
        </script> 
    </body>
</html>

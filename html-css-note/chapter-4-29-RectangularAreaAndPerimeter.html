<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişken tanımla
            var a, b, area, perimeter; 

            //ziyaretçiden a ve b kenarlarını al 
            a=Number(prompt("Dikdörtgenin a kenarını yazınız:"));
            b=Number(prompt("Dikdörtgenin b kenarını yazınız:"));
            
            //dikdörtgenin alanını ve çevresini hesapla hesapla 
            area=a*b;
            perimeter=2*(a+b);

            //ziyaretçiye sonucu yaz
            document.write("Dikdörtgenin alanı: "+area+"<br>");
            document.write("Dikdörtgenin çevresi: "+perimeter);
        </script> 
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişken tanımla
            var r, pi=3.14, area, perimeter; 

            //ziyaretçiden yarıçap al 
            r=Number(prompt("Dairenin yarıçapını yazınız:"));

            //yarıçap sorgu ve işlem
            if(r<0){
                alert("Yarıçap negatif olamaz...");
                alert("Lütfen sayfayı yenileyerek pozitif değere sahip yarıçap giriniz.");}
            else{
                area=pi*r*r;
                perimeter=2*pi*r;
                alert("alan= "+area+" çevre= "+perimeter);
            }
        </script> 
    </body>
</html>

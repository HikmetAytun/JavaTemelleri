<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişkenleri tanımla..
            var sayi1, sayi2    ;

            //kullanıcıdan sayı al
            sayi1=Number(prompt("1.sayıyı yazınız: "));
            sayi2=Number(prompt("2.sayıyı yazınız: "));
            
            //koşulları yazalım
            if(sayi1==sayi2)
                alert("1. ve 2.sayı birbirine eşittir.");
            else if(sayi1<sayi2)
                alert("Sayı 2 sayı 1 den büyüktür.")
            else
                alert("Sayı 1 sayı 2 den büyüktür.");
        </script> 
    </body>
</html>

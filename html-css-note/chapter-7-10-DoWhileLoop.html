<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            /*
    Bir önceki konuda while döngüsünü anlatırken önce şartın kontrol edildiğini ve şart sağlanırsa işlem yapıldığını 
    öğrenmiştik.
    Do-while komutunda ise önce işlem yapılır daha sonra şart kontrol edilir. Şart sağlandığı sürece de döngü devam eder.
    Yani do-while komutunda işlem ya da döndü en az bir defa çalışır.
            */
            var s=1;
            do{
                document.write("merhaba <br>");
                s++;
            } while(s<=5);

        </script> 
    </body>
</html>

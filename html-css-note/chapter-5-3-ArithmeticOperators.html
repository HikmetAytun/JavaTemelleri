<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">

    </head>
    <body>
        <script>
            var a=Number(prompt("a için sayı giriniz: "));
            var b=Number(prompt("b için sayı giriniz: "));

            var topla= a+b;
            var cikar= a-b;
            var carp= a*b;
            var bol= a/b;
            var modd= a%b;

            alert("toplam: "+topla+" çıkarma: "+cikar+" çarpma: "+carp+" bölme: "+bol+" modd: "+modd);
            
            document.write(("toplama sonucu: ") + topla+"<br>");
            document.write(("çıkarma sonucu: ") + cikar+"<br>");
            document.write(("çarpma sonucu: ") + carp+"<br>");
            document.write(("bölme sonucu: ") + bol+"<br>");
            document.write(("mod kalan sonucu: ") + modd+"<br>");
        </script> 
    </body>
</html>

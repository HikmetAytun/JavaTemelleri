                document.write("Bu bir DO-WHİLE döngüsüdür <br>");

            }

                if(s==4){
                    s++ 
                    continue;}
                document.write("Bu bir WHİLE döngüsüdür <br>");
                document.write("sayacınız: "+s+"<br>");
                s++
            }

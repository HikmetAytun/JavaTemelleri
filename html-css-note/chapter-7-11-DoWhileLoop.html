<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            var s=1, toplam=0;
            do{
                toplam=toplam+s;
                document.write("Döngü içindeki sayaç: "+s+" Döngü içindeki toplam: "+toplam+"<br>");
                s++
            }while(s<=20);
            document.write("Toplam: "+toplam);
        </script> 
    </body>
</html>

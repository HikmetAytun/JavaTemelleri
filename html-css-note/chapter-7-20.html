<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //Faktöriyel Hesabı
            //değişkenleri tanımla
            var n, s, f=1;
            //n değerini al.
            n=Number(prompt("n: "));
            //1'den n'e kadar sayıların çarpımıı
            for(s=1;s<=n;s++)
                f=f*s;

            document.write(n+"!= "+f);
        </script> 
    </body>
</html>

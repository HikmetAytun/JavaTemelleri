<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //Faktöriyel Hesabı
            //değişkenleri tanımla
            var n, sayac, f=1;
            //n değerini al.
            n=Number(prompt("n: "));
            //1'den n'e kadar sayıların çarpımıı
            for(sayac=1;sayac<=n;sayac++)
                f=f* sayac;

            document.write(n+"!= "+f);
        </script> 
    </body>
</html>

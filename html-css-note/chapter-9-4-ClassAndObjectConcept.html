<!DOCTYPE html>
<html>
    <head>
        <title>Sınıf ve Nesne Kavramı</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            /* 
            Sınıf ve Nesne Kavramı
            - Nesne tabanlı programlama dilinde her şey bir nesne olarak görülmektedir. Her nesnenin özellikleri (değişkenleri) ve metotları (fonksiyonları) vardır.
            - Özellikler nesnenin fiziksel görünümünü belirlerken, metotlar belirli işlerin yapılmasını sağlamaktadır.
            - Örneğin, kendimizi bir nesne olarak düşünelim. Boyumuz, kilomuz, ten rengeimiz ve göz rengimiz gibi özellikler fiziksel görünüşümüz belirler. İşte bu fiziksel görünüşümüzü belirleyen verilere (değişkenlere) özellikler denir.
            - Konuşma, yürüme, koşma gibi eylemler ise yapabildiğimiz işlerin yani metotlarımızı belirler.
            - Sınıflar nesnelerin bir tür projesi ya da kalıbı gibidir.
            - Nasıl bir makine üretilmeden önce onun bir projesi yapılıyorsa ve projeye göre seri üretim yapılıyorsa, nesnelerin de üretilmeden önce projesi yani sınıfları yapılıyor.
            - Yapılan sınıflardan da nesneler türetiliyor.
            - NTP (Nesne Tabanlı Programlama) açısından bir cep telefonundaki özellikler ve fonksiyonlar aşağıdaki gibidir:
              * Sınıf Adı: Telefon
              * Değişkenler (Özellikler):
                * Renk
                * Ağırlık
                * Yükseklik
              * Fonksiyonlar (İşlevler):
                * Aç (Açma düğmesine basarak)
                * Kapat (Kapatma düğmesine basarak)
                * Sesi artır (Ses artırma düğmesine basarak)
                * Sesi azalt (Ses azaltma düğmesine basarak)
            */  
        </script>
    </body>
</html>

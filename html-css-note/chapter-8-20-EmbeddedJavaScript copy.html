<!DOCTYPE html>
<html>
    <head>
        <title>Gömülü JavaScript</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            function ucgenAlani(t, y) {
                let alan = (t * y) / 2;
            }
            return alan;
            let taban = Number(prompt("Taban: "));
            let yuksek = Number(prompt("Yükseklik: "));
            document.write("Üçgeniniz alanı: " + ucgenAlani(taban, yuksek));
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişken tanımla
            var r, pi=3.14, area, perimeter; 

 
            //ziyaretçiden a ve b kenarlarını al 
            r=Number(prompt("Dairenin yarıçapını yazınız:"));
            
            //dikdörtgenin alanını ve çevresini hesapla hesapla 
            area=pi*r*r;
            perimeter=2*pi*r;

            //ziyaretçiye sonucu yaz
            document.write("Dairenin alanı: "+area+"<br>");
            document.write("Dairenin çevresi: "+perimeter);
        </script> 
    </body>
</html>

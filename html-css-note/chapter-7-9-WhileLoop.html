<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            // 1'den 5'e kadar sayıların toplamını yazdırma.

            var s=1, toplam=0;
            while(s<=5){ 
                document.write("sayaç= "+s);
                toplam=toplam+s;
                document.write("döngü içindeki toplam değer= "+toplam);
                s++;
                document.write("<br>");
            }
            document.write("Toplam: "+toplam);
            </script> 
    </body>
</html>

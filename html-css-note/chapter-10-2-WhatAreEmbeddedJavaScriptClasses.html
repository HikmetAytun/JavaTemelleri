<!DOCTYPE html>
<html>
    <head>
        <title>Gömülü JavaScript Sınıfları Nedir?</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            /*
            Gömülü/Hazır JavaScript Nedir ?
            - Daha önce de öğrendiğimiz gibi, sınıflar programcı tarafından yazılan ve gerektiğinde çağırılıp çalıştırılabilen kodlardır.
            - Önceki derslerde JavaScript sınıflarının nasıl oluşturulduğunu ve nasıl kullanıldığını uygulamalarla öğrendik.
            - Bu bölümde JavaScript içinde hazı olarak gelen ve sıklıkla kullanılan sınıfları ve bu sınıf içindeki bazı fonksiyonları öğreneceğiz.
            - Yaygın kullanılan JavaScript sınıfları şunlardır:
              - Math, Number, String,Date, Array, Boolean.
            - Bu bölümde aşağıdaki JavaScript sınıflarının kullanımını öğreneceğiz:
              - Math, Number, String, Date.
            - Bu sınıfları (nesne oluşturmadan) doğrudan kullanabiliriz.
            - Her sınıfın kendine ait özellik ve metotları vardır.
            - Özellikler bir nesnenin görselliğini/değerini değiştirirken metotlar nesnenin bir iş yapmasını sağlar.
            - Bir nesnenin özellik veya metodunu aşağıdaki gibi kullanabiliriz: 
              - Nesne.Özellik=değer;
              - Nesne.Metot(parametreler);  //Özellik nesnenin görünümünü/değerini değiştirir.
              - Nesne.Method();             //Metot nesnenin bir iş yapmasını sağlar.
            */
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //Sadece pozitif sayıların toplamı
            var sayi, kare;
            do{
                sayi=Number(prompt("Sayı giriniz: "));
            }while(sayi<=0);
            kare=sayi*sayi;
            document.write("Girdiğiniz sayı: "+sayi+" Girdiğiniz sayının karesi: "+kare);
        </script> 
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Fonksiyon Nedir?</title>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            /* Değer döndüren fonksiyon 
                Bu tür fonksiyonlar belli bir kodu çalıştırırlar ve kodun çalışması sonucunda
                ana programa bir değer döndürürler. Parametresiz, tek veya çok parametreli olabilirler.
            Örnek:
            function kare(x){
            return x*x;
            }*/
            function kare(x) {
                return x * x;
            }
            document.write(kare(2));
            document.write("<br>");
            document.write(kare(5));
        </script> 
    </body>
</html>

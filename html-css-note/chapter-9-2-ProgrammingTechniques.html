<!DOCTYPE html>
<html>
    <head>
        <title>Programlama Teknikleri</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            /* İnsanoğlu Charles Babbage adlı İngiliz mühendisin 1822 yılında yaptığı Fark Makinesi (Difference Engine) adlı mekanik
            bilgisayarla beraber aşağı yukarı 200 yıldır programcılıkla uğraşmaktadır.
            Doğal olarak iki yüzyıl boyunca programlama kavramları ve metodları değişik aşamalar kat etmiştir.
            Genel olarak programlama dillerini ve teknolojilerini sınıflandıracak olursak üç farklı teknoloji ile karşılaşırız:
            1. Doğrusal Programlama
            2. Yapısal Programlama
            3. Nesne Yönelimli Programlama

            Doğrusal Programlama
            Doğrusal programlamada tüm komutlar alt alta yazılır ve sırayla çalıştırılır.
            Programda dallanma oluşturmak için goto benzeri komutlar ve etiketler kullanılır.
            Dallanma ve etiketler programı karmaşık hale getirdiği için özellikle büyük projelerde kodlar arap saçına döner;
            programın okuması ve anlaşılması iyice zorlaşır.

            Yapısal Programlama
            Doğrusal programlama küçük programlar için uygunken büyük programlar için uygun değildir; goto gibi komutlar program 
            akışını ve yönetilmesini zorlaştırır.
            Bu nedenle doğrusal programlama terkedilmiş ve yapısal programlama kavramı ortaya atılmıştır.
            Yapısal programlamada kodlar küçük parçalar (fonksiyon) halinde yazılır ve gerektiğinde çağrılıp kullanılır.
            Fonksiyonları yazmak ve değiştirmek daha kolaydır.
            Bu sayede programın okunması ve anlaşılması daha kolay hale gelir.
            Yapısal programlama, doğrusal programlamanın aksine büyük projelerde daha verimli ve sürdürülebilir bir yaklaşım sunar.

            Nesne Tabanlı Programlama
            1960'lı yılların sonunda ortaya atılan nesne tabanlı programalama, temel olarak programların bağımsız ve birbiriyle
            veri alışverişi yapabilen küçük parçalardan oluşmasını sağlar.
            Yani, NTP'da modüle dediğimiz yöntem kullanılmakta ve farklı modüllerin birbiri ile iletişim kurabilmesi ve beraber
            çalışabilmesi benimsenmektedir.
            Bu sayede çok büyük ve çok karmaşık yazılımlar daha kolay üretilebilmekte ve daha kolay yönetilebilmektedir.

            */  
        </script>
    </body>
</html>

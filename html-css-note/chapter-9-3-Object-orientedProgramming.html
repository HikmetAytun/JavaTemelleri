<!DOCTYPE html>
<html>
    <head>
        <title>Nesne Tabanlı Programlama</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            /* Nesne Tabanlı Programlama (Object-oriented Programming) Özellikleri
            Modülerliğin yanında nesne tabanlı programlama ayrıca,
             bilgi gizleme (encapsulation)
             veri soyutlama (data abstraction)
             çok biçimlilik (polymorphism)
             kalıtım (inheritance) gibi özelliklere sahiptir.
             
             Bu özellikler programların bakımını ve aynı program üzerinde birden fazla kişinin çalışmasını kolaylaştıran kavramları da programlama dünyasına kazandırmıştır.

             Tüm bu avantajlarından dolayı, nesne tabanlı programlama kurumsal uygulamalarda en çok tercih edilen programlama yöntemidir.

             Bilgi Gizleme (Encapsulation) Nedir?
             - Nesne tabanlı programlamada yazılan kodlar adına sınıf denilen yapılar/bloklar içinde bulunur.
             - Sınıf içinde bulunan değişkenler ve metotlar dışarıdaki kodların erişimine kapalıdır (gizlidir).
             - Sınıf dışındaki kodlar izin verilirse sınıf içindeki kodların bir kısımına erişebilir, izin verilmeyen kodlara kesinlikle erişemez.
             - Ayrıca, sınıfta yazılan kodlar dışarıdaki kodlara/kullanıcılara da görünmez. Zaten kullanıcıların sınıf içindeki kodları görmesi de gerekmez.

             Çok Biçimlilik (Polymorphism) Nedir?
             - Çok biçimlilik belirli kodlaarın birbiriyle ilgili birden fazla iş için kullanılmasını sağlar.
             - Örneğin, iki tam sayının toplamını yapan bir fonksiyon yazdıysanız bu fonksiyon sadece iki tam sayının toplamını yapar. Eğer iki kesirli sayıyı toplamaya kalkarsanız hata alırsınız. Çok biçimlilik sayesinde aynı fonksiyon farklı veri tipleriyle de çalışabilir.
             - Fakat çok biçimlilik sayesinde bu fonksiyon farklı sürümlerini yazıp hem tamsayı hem de kesirli sayı toplanmasını sağlayabilirsiniz. 

             Kalıtım (Inheritance) Nedir?
             - Nasıl doğduğumuzda anne ve babamızın baze genetik özelliklerini alıyorsak, nesne tabanlı programlamada yeni oluşturulan nesneler/kodlar üretildikleri sınıfların/kodların özelliklerini alır.
             - Kalıtım özelliği sayesinde çok daha hızlı uygulama geliştirebilirsiniz.
             - Örneğin, bir dairenin alanını ve çevresini hesaplayan bir kod yazdığınızı düşünün. Eğer bu kodları Daire adlı bir sınıf içine koyar ve bu sınıftan yeni nesneler türetirseniz yeni türetilen nesneler sınıfın tüm kodlarına (fonksiyon ve değişkenlerini) otomatik olarak sahip olur.
            */  
        </script>
    </body>
</html>

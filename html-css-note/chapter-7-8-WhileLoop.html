<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            // Döngü sayısının belli olmadığı durumlarda while döngüsü kullanılır; belirtilen şart sağlandığı sürece döngü
            // çalışmaya devam eder.
            var s=1;
            while(s<=5){
                document.write("Merhaba <br>");
                s++;
            }
            </script> 
    </body>
</html>

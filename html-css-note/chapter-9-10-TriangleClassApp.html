            class Ucgen{
                static genislik=0;
                static yukseklik=0;
                alan(){
                    return (this.genislik * this.yukseklik) / 2;
                }
            }
            
            //nesne oluşturma 
            let u1= new Ucgen();
            u1.genislik=1;
            u1.yukseklik=2;

<!DOCTYPE html>
<html>
    <head>
        <title>Fonksiyon Nedir?</title>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            /* Tek parametreli değer döndürmeyen fonksiyon 
                Parametre fonksiyona ana program tarafından gönderilen değerdir.
                Fonksiyon ana programdan gelen değeri alarak bir değişken gibi kullanabilir. 
                Fakat bu tür fonksiyonlar ana programa bir değer döndürmezler.
                Örnek: 
                function merhaba(ad) {
                    document.write("Merhaba " + ad + "nasılsın?");
                }
                merhaba("Hikmet"); */
               function merhaba(ad) {
                   document.write("Merhaba " + ad + " nasılsın?");
               }
               merhaba("Hikmet"); // Fonksiyon çağırılır ve çalıştırılır. 

        </script> 
    </body>
</html>

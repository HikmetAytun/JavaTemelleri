<!DOCTYPE html>
<html>
    <head>
        <title>Çift Sayıları Yazdırma Fonksiyonu</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            function yazxy(x,y) {               //fonksiyon tanımlanır ve parametre olarak a ve b alınır.   
                while (x <= y) {                //while döngüsü ile a'dan b'ye kadar olan sayılar arasında artış yapılır ve x değişkenine atanır.
                    document.write(x + "<br>");    //document.write() ile ekrana x değişkeni yazdırılır.
                    x++;
                    }
                }
            /*function yazxy(x,y){
                for (let s = x; s <= y; s++) {         //for döngüsü ile a'dan b'ye kadar olan sayılar arasında artış yapılır ve s değişkenine atanır.
                    document.write(s + "<br>");          //document.write() ile ekrana s değişkeni yazdırılır.
                }
            }*/
            //ekrandan iki değer alalım
            let a = Number(prompt("a: "));   //prompt ile kullanıcıdan a değeri alınır ve Number() ile sayıya çevrilir.
            let b = Number(prompt("b: "));   //prompt ile kullanıcıdan b değeri alınır ve Number() ile sayıya çevrilir.
            yazxy(a, b);    //yazxy() fonksiyonu çağrılır ve a ve b parametre olarak gönderilir. Geri döndürülen değer ekrana yazdırılır.
        </script>
    </body>
</html>

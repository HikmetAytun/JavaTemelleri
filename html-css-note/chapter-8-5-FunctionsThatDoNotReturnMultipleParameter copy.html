<!DOCTYPE html>
<html>
    <head>
        <title>Fonksiyon Nedir?</title>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            /* Çok parametreli değer döndürmeyen fonksiyon 
            Aşağıdaki fonksiyona ana programdan iki değer gönderilir. Gönderilen 
            değerler toplar ve ekrana yazar. Ana programa her hangi bir değer döndürmez.
            Örnek:
            function topla(sayi1, sayi2) {
                var topla = sayi1 + sayi2;
                document.write("Toplam: " + topla);
            }
            topla(3, 5); //fonksiyonu çağırır ve çalıştırır. Ana programa bir değer döndürmez. */
            function topla(a, b) {
                var topla = a + b;
                document.write("Toplam: " + topla + "<br>");
            }
            topla(1, 3); //fonksiyonu çağırır ve çalıştırır. Ana programa bir değer döndürmez.
            topla(2, 2);
            topla(23124, 1234123);
        </script> 
    </body>
</html>

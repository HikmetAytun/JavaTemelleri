<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            // Sıfırdan n'e kadar olan çift sayıların toplamı
            var toplam=0;
            var n=Number(prompt("n:"));
            for(var sayac=0; sayac<=n; sayac=sayac+2){
                toplam= toplam+sayac;
                document.write("Sayac: "+sayac+"Toplam: "+toplam+"<br>");
            }
            document.write("toplam: "+toplam);
            </script> 
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Sınıf Özellikleri</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            /* 
            Sınıf Özellikleri (Değişkenler)
            - Sınıf içinde tanımlanan değişkenlere özellik (property) denir.
            Örnek:
            class Ucgen{
                static genislik=0;
                static yukseklik=0;

                alan(){
                    return (this.genislik*this.yukseklik)/2;
                }
            }
            - Sınıf özellikleri, sınıfın durumunu (state) temsil eder.
            - Sınıf özellikleri aşağıdaki özelliklere sahiptir:
              * Sınıfın verilerini tutar.
              * Sınıftan oluşturulan nesneler tarafından erişilebilir.
              * "constructor" içinde tanımlanırlar.
            */  
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Toplam Fonksiyonu</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            function topla(a,b){       //fonksiyon tanımlanır ve parametre olarak a ve b alınır.
                return a+b;          //fonksiyon çağrıldığında a+b işlemi yapılır ve geri döndürülür.

            }//prompt ile kullanıcıdan sayi1 değeri alınır ve Number() ile sayıya çevrilir.
            let sayi1=Number(prompt("Toplamak istediğiniz ilk sayıyı giriniz:"));   
            //prompt ile kullanıcıdan sayi2 değeri alınır ve Number() ile sayıya çevrilir.
            let sayi2=Number(prompt("Toplamak istediğiniz ikinci sayıyı giriniz:"));   
            //topla() fonksiyonu çağrılır ve sayi1 ve sayi2 parametre olarak gönderilir. Geri döndürülen değer ekrana yazdırılır.
            document.write("Girdiğiniz sayıların toplamı: " + topla(sayi1, sayi2));  
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişkenleri tanımla..
            var not1, not2;

            //kullanıcıdan sayı al
            not1=Number(prompt("1.notu yazınız: "));
            not2=Number(prompt("2.notu yazınız: "));
            
            //ortalamayı al
            ort=(not1+not2)/2;
            //koşulları yazalım
            if(ort<=50)
                alert("ortalamanız: "+ort+" notunuz 50 den düşük olduğu için kaldınız..")
            else
                alert("ortalamanız: "+ort+" notunuz 50 den yüksek olduğu için geçtiniz..")
        </script> 
    </body>
</html>

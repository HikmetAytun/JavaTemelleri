<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            var weather;
            weather=Number(prompt("Hava sıcaklığını yazınız: "));
            if(weather<0)
                alert("DONDURUCU");
            else if(weather<15)
                alert("SOĞUK");
            else if(weather<25)
                alert("ILIK");
            else
                alert("SICAK");
        </script> 
    </body>
</html>

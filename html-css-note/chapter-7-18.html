<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //1'den n'e kadar olan sayıların toplamı
    
            //değişkenler tanımla
            var toplam=0,s,n;
            //n değeri kullanıcıdan al
            n=Number(prompt("n: "));
            //for döngüsü
            for(s=1;s<=n;s++)
            toplam+=s;
            document.write("For Toplam: "+toplam+"<br>");

            //while döngüsü
            s=1, toplam=0;
            while(s<=n){
                toplam+=s;  
                s++;
            }
            document.write("While Toplam: "+toplam+"<br>");
        </script> 
    </body>
</html>

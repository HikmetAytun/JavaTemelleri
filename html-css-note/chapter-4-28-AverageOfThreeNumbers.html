<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişken tanımla
            var number1, number2, number3, avg; 

            //ziyaretçiden üç tane sayı al
            number1=Number(prompt("1.Sayıyı Giriniz:"));
            number2=Number(prompt("2.Sayıyı Giriniz:"));
            number3=Number(prompt("3.Sayıyı Giriniz:"));
            
            //üç sayının ortalamasını hesapla 
            avg=((number1+number2+number3)/3);
 
            //ziyaretçiye sonucu yaz
            document.write("Girdiğiniz Sayıların Ortalaması: "+avg);
        </script> 
    </body>
</html>

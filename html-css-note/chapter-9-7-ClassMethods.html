<!DOCTYPE html>
<html>
    <head>
        <title>Sınıf Metotları</title>
        <meta charset="utf-8">
        <script src="HariciDosya.js"></script>

    </head>
    <body>
        <script>
            /* 
            Sınıf Metotları (Fonksiyonlar)
            - Sınıf içinde tanımlanan fonksiyonlara metot denir.
            Örnek:
            class Daire{
                constructor(yaricap){
                    this.yaricap = yaricap;
                }
                alan(){
                    return 3.14 * this.yaricap * this.yaricap;
                }
                cevre(){
                    return 2 * 3.14 * this.yaricap;
                }
            }
            - Sınıf metotları, sınıf içinde tanımlanan fonksiyonlardır.
            - Sınıf metotları aşağıdaki özelliklere sahiptir:
              * Sınıfın davranışlarını tanımlar.
              * Sınıftan oluşturulan nesneler tarafından çağrılabilir.
              * "constructor" dışında tanımlanırlar.
            */  
        </script>
    </body>
</html>

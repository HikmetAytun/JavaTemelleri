            //Hocanın videoda anlattıkları:
            var a,b,c=1;
            a=5;    //atama işlemi.
            b=Number(prompt("b: ")) //b değişkenini ziyaretçiden al.
            a+=1;       // a değişkeninin değerini 1 artır sonucu a'ya yaz.
            b-=1;       // b değişkeninin değerini 1 azalt sonucu b'ye yaz.
            c*=a;       // c değişkenini a değişkeni ile çarp c'ye yaz.

            document.write("a= "+a+" b= "+b+" c= "+c);

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            //önce değişkenleri tanımla..
            var x, y;

            //kullanıcıdan sayı al
            x=Number(prompt("x sayısını yazınız: "));
            y=Number(prompt("y sayısını yazınız: "));
            
            //koşulları yazalım
            if(x>y)
                alert("x sayısı y sayısından büyüktür");
            else
                alert("y sayısı x sayısından büyüktür");
        </script> 
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">

    </head>
    <body>
        <script>
            var yas=Number(prompt("yaşınız:"));
            if(yas<2)
                alert("bebek")
            else if(yas<=12)
                alert("çocuk")
            else if(yas<=18)
                alert("genç")
            else if(yas<=40)
                alert("yetişkin")
            else if(yas<=60)
                alert("olgun")
            else
                alert("yaşlı")

            //sıradaki kodlar
        </script>
    </body>
</html>

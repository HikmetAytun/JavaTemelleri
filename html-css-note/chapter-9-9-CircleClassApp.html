            class Daire{
                constructor(yaricap){
                    this.yaricap = yaricap;
                }
                    alan(){
                        return 3.14 * this.yaricap * this.yaricap;
                    }
                    cevre(){
                        return 2 * 3.14 * this.yaricap;
                    }
            }
            let yaricap1 = Number(prompt("Yarıçap giriniz: "));
            let daire1 = new Daire(yaricap1);
            let yaricap2 = Number(prompt("Yarıçap giriniz: "));
            let daire2= new Daire(yaricap2);

            document.write("Daire 1 alanı= "+daire1.alan()+"<br>");
            document.write("Daire 1 çevresi= "+daire1.cevre()+"<br>");
            document.write("Daire 2 alanı= "+daire2.alan()+"<br>");
            document.write("Daire 2 çevresi= "+daire2.cevre());

                
        </script>
